name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Visual pins require Python >=3.12 (numpy 2.5.4 / scipy 1.18.1).
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl ffmpeg
          mkdir -p tools/exiftool
          ln -sf "$(command -v exiftool)" tools/exiftool/exiftool

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-visual.txt -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Scan tracked files for credentials and private network IDs
        run: python tools/maintenance/scan_secrets.py

      - name: Static checks (syntax and undefined names)
        run: ruff check src tests tools

      - name: Compile all Python sources
        run: python -m compileall -q src tests tools

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
