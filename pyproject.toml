[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nas-photo-intelligence"
version = "0.1.0"
description = "Bounded read-only photo metadata evidence index"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
visual = ["Pillow==12.3.0", "pillow-heif==1.8.1", "ImageHash==4.3.2"]

[project.scripts]
nas-photo = "nas_photo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
